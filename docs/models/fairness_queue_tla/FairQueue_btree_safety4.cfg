\* Btree merge (BtreeMerge = TRUE), safety only at MaxLevel=4 for broader
\* invariant coverage (liveness at 4 is too slow for routine runs). Includes
\* NoStuck. Mirror of FairQueue_safety4.cfg but for the current merge.
SPECIFICATION FairSpec
CONSTANTS
  MaxLevel = 4
  BatchTarget = 2
  ReloadAt = 1
  WBatchMax = 1
  StuckRepair = TRUE
  BtreeMerge = TRUE
  EvictedCacheMax = 1
  AckableLevels = {1, 2, 3, 4}
  MutAtEndOnMiddleRead = FALSE
  MutAckPastLoaded = FALSE
  MutNoWriteBuffering = FALSE
  MutResetReadLevelOnEmptyMerge = FALSE
  MutKeepEvictedAcks = FALSE
  MutNoPin = FALSE
  MutGcReadLevel = FALSE
  MutNoExitRecheck = FALSE
  MutNoReadOnWriteError = FALSE
  MutNoAtEndResetOnWriteError = FALSE
  MutDropExpiredEarly = FALSE
  MutCachePoison = FALSE
INVARIANTS
  TypeInv
  MemWindow
  AckBelowRead
  LoadedInDb
  LoadedBounded
  NoAckSkipped
  CacheBounded
  CacheOnlyAcked
  PinProtectsWrites
  GCOnlyAcked
  NoStuck
CHECK_DEADLOCK FALSE
