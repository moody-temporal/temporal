\* Finding #1 regression: with a task that never completes (AckableLevels
\* excludes level 1), the reader busy-loops re-reading instead of
\* quiescing. Expect ReaderQuiesce to be VIOLATED on current code.
SPECIFICATION FairSpec
CONSTANTS
  MaxLevel = 2
  BatchTarget = 2
  ReloadAt = 1
  WBatchMax = 1
  StuckRepair = TRUE
  EvictedCacheMax = 1
  AckableLevels = {2}
  MutAtEndOnMiddleRead = FALSE
  MutAckPastLoaded = FALSE
  MutNoWriteBuffering = FALSE
  MutResetReadLevelOnEmptyMerge = FALSE
  MutKeepEvictedAcks = FALSE
  MutNoPin = FALSE
  MutGcReadLevel = FALSE
  MutNoExitRecheck = FALSE
  MutNoReadOnWriteError = FALSE
  MutNoAtEndResetOnWriteError = FALSE
  MutDropExpiredEarly = FALSE
  MutCachePoison = FALSE
PROPERTIES
  ReaderQuiesce
CHECK_DEADLOCK FALSE
