\* Finding #1 under the CoW-btree merge (BtreeMerge = TRUE). Same setup as
\* FairQueue_churn.cfg (level 1 never acked: AckableLevels excludes it), but
\* with the btree merge. The old merge lowers readLevel to max(loaded) on an
\* empty read-to-end, evicts the ack above it, and forces atEnd=FALSE -> an
\* endless re-read cycle (ReaderQuiesce VIOLATED). The btree merge keeps the
\* ack in the tree and readLevel at its level, so atEnd stays TRUE and the
\* reader quiesces. Expect: ReaderQuiesce holds (no error) -- the fix.
SPECIFICATION FairSpec
CONSTANTS
  MaxLevel = 2
  BatchTarget = 2
  ReloadAt = 1
  WBatchMax = 1
  StuckRepair = TRUE
  BtreeMerge = TRUE
  EvictedCacheMax = 1
  AckableLevels = {2}
  MutAtEndOnMiddleRead = FALSE
  MutAckPastLoaded = FALSE
  MutNoWriteBuffering = FALSE
  MutResetReadLevelOnEmptyMerge = FALSE
  MutKeepEvictedAcks = FALSE
  MutNoPin = FALSE
  MutGcReadLevel = FALSE
  MutNoExitRecheck = FALSE
  MutNoReadOnWriteError = FALSE
  MutNoAtEndResetOnWriteError = FALSE
  MutDropExpiredEarly = FALSE
  MutCachePoison = FALSE
PROPERTIES
  ReaderQuiesce
CHECK_DEADLOCK FALSE
