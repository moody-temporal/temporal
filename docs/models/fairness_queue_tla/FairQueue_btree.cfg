\* Current CoW-btree merge (BtreeMerge = TRUE): full safety + liveness at
\* MaxLevel=3, and additionally NoStuck as an INVARIANT. The old merge
\* reaches the "fair reader stuck" state via an expired write (findings.md
\* #3), so NoStuck is not an invariant there; the btree merge keeps
\* readLevel at the max of all kept entries and never lowers it below a
\* retained ack, so the stuck state should be unreachable -- NoStuck should
\* hold here. Expect: no error.
SPECIFICATION FairSpec
CONSTANTS
  MaxLevel = 3
  BatchTarget = 2
  ReloadAt = 1
  WBatchMax = 1
  StuckRepair = TRUE
  BtreeMerge = TRUE
  EvictedCacheMax = 1
  AckableLevels = {1, 2, 3}
  MutAtEndOnMiddleRead = FALSE
  MutAckPastLoaded = FALSE
  MutNoWriteBuffering = FALSE
  MutResetReadLevelOnEmptyMerge = FALSE
  MutKeepEvictedAcks = FALSE
  MutNoPin = FALSE
  MutGcReadLevel = FALSE
  MutNoExitRecheck = FALSE
  MutNoReadOnWriteError = FALSE
  MutNoAtEndResetOnWriteError = FALSE
  MutDropExpiredEarly = FALSE
  MutCachePoison = FALSE
INVARIANTS
  TypeInv
  MemWindow
  AckBelowRead
  LoadedInDb
  LoadedBounded
  NoAckSkipped
  CacheBounded
  CacheOnlyAcked
  PinProtectsWrites
  GCOnlyAcked
  NoStuck
PROPERTIES
  AckLevelMonotonic
  AllTasksAcked
  EventuallyDrained
CHECK_DEADLOCK FALSE
